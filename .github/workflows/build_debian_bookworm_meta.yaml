name: '🏗️ Build bookworm jellyfin-ffmpeg'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - jellyfin
      - jellyfin-7.0
    paths-ignore:
      - '**/*.md'

  pull_request:
    branches:
      - jellyfin
      - jellyfin-7.0
    paths-ignore:
      - '**/*.md'

jobs:
  build_debian:
    uses: ./.github/workflows/_meta.yaml
    with:
      distro: 'debian'
      codenames: '["bookworm"]'
      architectures: '["amd64"]'
      release: false
